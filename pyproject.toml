[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robofleet"
version = "0.1.0"
description = "AI-led operations command centre and digital twin for robot-assisted dark stores"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.102.0",
    "httpx>=0.27.0",
    "types-pyyaml>=6.0.12.20240311",
    "matplotlib>=3.8.0",
    "psutil>=5.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/robofleet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "UP042", "UP046", "E741"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "backend/src"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
