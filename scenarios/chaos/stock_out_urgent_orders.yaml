# Chaos Scenario: Stock-out Under Urgent Orders
name: stock_out_urgent_orders
description: "Simulates sudden bin stock depletion while urgent express orders are en route."
duration_ticks: 600
demand_overlay: null

scheduled_faults:
  - tick: 40
    fault_type: bin_missing_stock
    target_id: BIN-0005
    duration_ticks: 200
    severity: HIGH
  - tick: 80
    fault_type: urgent_order_burst
    target_id: system
    duration_ticks: 120
    severity: HIGH
    params:
      order_count: 6

pass_criteria:
  max_lost_orders: 0
  max_safety_violations: 0
  min_on_time_pct: 65.0
  max_recovery_ticks: 250
  max_unverified_picks: 0
