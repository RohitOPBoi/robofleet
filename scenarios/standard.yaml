# Standard Dark Store Scenario (20 Robots) - Primary Benchmark
scenario_name: standard
seed: 42
robot_count: 20

timing:
  tick_hz: 10
  max_duration_s: 3600

physics:
  cell_size_m: 0.8
  robot_speed_mps: 1.2
  turn_cost_ticks: 5

battery:
  drain_moving_per_tick: 0.01
  drain_idle_per_tick: 0.001
  charge_rate_per_tick: 0.05
  low_battery_threshold: 20.0
  critical_battery_threshold: 10.0
  recharge_target_pct: 95.0

layout:
  preset: standard
  width: 28
  height: 20
  rack_rows: 4
  rack_length: 14
  rack_levels: 4
  aisle_width: 2
  cross_aisle_width: 2
  station_count: 3
  charger_count: 4
  parking_count: 25
  right_hand_traffic: true

catalogue:
  source_type: generated
  sku_count: 1500
  empty_bin_pct: 5.0
  top_k_popular_replicas: 50

rules:
  rules_dir: rules
  hot_reload: true

orders:
  adapter: demand_engine
  demand_profile: profiles/standard_evening.yaml
  at_risk_threshold_ticks: 150
  history_limit: 500
  rush_multiplier: 1.0
  urgent_share: 0.20
  nominal_service_time_ticks: 300

server:
  host: 127.0.0.1
  port: 8000
  delta_hz: 10.0
  auth_token: secret-robofleet-token
  cors_origins: ["*"]

verification:
  enabled: true
  base_error_rate: 0.04
  retry_limit: 1
  confidence_threshold: 0.85
  grasp_failure_rate: 0.015
  wrong_item_rate: 0.010
  quantity_mismatch_rate: 0.010
  damaged_item_rate: 0.005

chaos:
  enabled: true
  scenario_file: null
  random_injection_rate: 0.0

replenishment:
  enabled: true
  low_stock_threshold: 3
  restock_quantity: 10
  stocker_speed_ticks: 40

reslotting:
  enabled: true
  evaluation_interval_ticks: 250
  max_recommendations: 5
  max_congestion_proxy_limit: 0.75

planner:
  type: astar_flow
  params:
    replan_wait_ticks: 10
    yield_wait_ticks: 30
    deadlock_threshold_ticks: 60

dispatcher:
  type: robot_supervisor
  params:
    dwell_ticks: 20
